<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA deep link redirection handler
    // Converts deep link paths like /projects/ai-resume-builder into query parameter redirection
    (function() {
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    })();
  </script>
</head>
<body style="background-color: #05070D; color: #00F0FF; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Initializing Neural Link & Routing...</p>
</body>
</html>
