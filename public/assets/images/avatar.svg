<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cyber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="#0B0F19"/>
  <circle cx="100" cy="100" r="85" fill="url(#cyber-glow)"/>
  <circle cx="100" cy="100" r="75" stroke="#1E293B" stroke-width="2"/>
  <circle cx="100" cy="100" r="75" stroke="#00F0FF" stroke-width="2" stroke-dasharray="12 12" stroke-opacity="0.6"/>
  <!-- Hexagon tech emblem -->
  <polygon points="100,45 145,70 145,130 100,155 55,130 55,70" stroke="url(#cyber-grad)" stroke-width="3" fill="#111827" fill-opacity="0.8"/>
  <!-- Silhouette head/shoulders with cyber visor -->
  <path d="M80,120 Q100,105 120,120 L135,150 Q100,165 65,150 Z" fill="#1E293B"/>
  <circle cx="100" cy="85" r="22" fill="#1E293B"/>
  <rect x="86" y="80" width="28" height="6" rx="3" fill="#00F0FF"/>
  <!-- Circuit lines -->
  <line x1="55" y1="100" x2="35" y2="100" stroke="#00F0FF" stroke-width="1.5"/>
  <circle cx="35" cy="100" r="3" fill="#00F0FF"/>
  <line x1="145" y1="100" x2="165" y2="100" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="165" cy="100" r="3" fill="#10B981"/>
  <line x1="100" y1="45" x2="100" y2="25" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="100" cy="25" r="3" fill="#8B5CF6"/>
</svg>