<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="grad-agentic-ai-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="line-agentic-ai-mesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#grad-agentic-ai-mesh)"/>
  <rect x="2" y="2" width="796" height="446" rx="14" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Technical grid pattern -->
  <g opacity="0.15">
    <line x1="0" y1="75" x2="800" y2="75" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="225" x2="800" y2="225" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="0" y1="375" x2="800" y2="375" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="450" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="450" stroke="#8B5CF6" stroke-width="1"/>
  </g>

  <!-- Cyber circuit graphics -->
  <circle cx="400" cy="180" r="90" fill="#8B5CF6" fill-opacity="0.05" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 6"/>
  <polygon points="400,120 450,150 450,210 400,240 350,210 350,150" stroke="#8B5CF6" stroke-width="2.5" fill="#111827"/>
  <circle cx="400" cy="180" r="20" fill="#8B5CF6" fill-opacity="0.3"/>
  <circle cx="400" cy="180" r="8" fill="#8B5CF6"/>

  <!-- Status indicator & decorative telemetry -->
  <rect x="40" y="40" width="130" height="30" rx="6" fill="#111827" stroke="#8B5CF6" stroke-width="1"/>
  <circle cx="56" cy="55" r="4" fill="#8B5CF6"/>
  <text x="68" y="60" font-family="monospace" font-size="12" fill="#8B5CF6" font-weight="bold">SYSTEM ACTIVE</text>
  <text x="630" y="60" font-family="monospace" font-size="12" fill="#94A3B8">BUILD_V2.6.4 // PROD</text>

  <!-- Project Title and Details banner -->
  <rect x="40" y="310" width="720" height="100" rx="10" fill="#111827" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="40" y1="310" x2="240" y2="310" stroke="url(#line-agentic-ai-mesh)" stroke-width="3"/>
  <text x="65" y="352" font-family="sans-serif" font-weight="bold" font-size="24" fill="#F8FAFC">Agentic AI Orchestration Mesh</text>
  <text x="65" y="385" font-family="monospace" font-size="14" fill="#8B5CF6">LangChain • LangGraph • Triton • llama-cpp</text>
</svg>