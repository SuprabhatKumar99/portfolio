name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application for Production
        run: npm run build:prod -- --base-href /

      - name: Configure SPA Fallback for GitHub Pages
        run: |
          # Copy index.html to 404.html in the build output to allow direct deep-link route navigation
          BUILD_DIR="dist/portfolio/browser"
          if [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR="dist/portfolio"
          fi
          echo "Build directory resolved to: $BUILD_DIR"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/portfolio/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
